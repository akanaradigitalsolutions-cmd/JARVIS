<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="hud-frame"><span></span></div>
  <div id="drop-overlay">Drop to attach</div>

  <div id="hud" class="idle booting">
    <svg class="hud-dial" viewBox="0 0 200 200">
      <circle class="dial-track" cx="100" cy="100" r="94" />
      <circle class="dial-teeth" cx="100" cy="100" r="84" />
      <circle class="dial-band" cx="100" cy="100" r="66" />
      <circle class="dial-band-ticks" cx="100" cy="100" r="66" />
      <!-- Static -90deg rotation on the group (so the arc starts at 12
           o'clock) lives on a wrapping <g>, not the animated circle itself:
           a CSS transform animation on an element completely replaces any
           SVG transform attribute on that same element, so the two can't
           share one node. -->
      <g transform="rotate(-90 100 100)">
        <circle class="dial-highlight" cx="100" cy="100" r="66" />
      </g>
      <g class="dial-cardinals">
        <rect x="98.5" y="2" width="3" height="10" rx="1" />
        <rect x="98.5" y="188" width="3" height="10" rx="1" />
        <rect x="2" y="98.5" width="10" height="3" rx="1" />
        <rect x="188" y="98.5" width="10" height="3" rx="1" />
      </g>
      <g class="dial-dots">
        <circle cx="85.8" cy="19.3" r="2.4" />
        <circle cx="97.1" cy="18.1" r="2.4" />
        <circle cx="108.6" cy="18.5" r="2.4" />
        <circle cx="119.8" cy="20.4" r="2.4" />
        <circle cx="130.7" cy="24.0" r="2.4" />
      </g>
    </svg>
    <div class="hud-core">
      <div class="hud-core-glow"></div>
      <div class="hud-title">JARVIS</div>
      <div class="hud-equalizer"><span></span><span></span><span></span><span></span><span></span></div>
      <div class="hud-status" id="hud-status">online</div>
    </div>
  </div>

  <main id="chat-panel">
    <div id="chat-log" aria-live="polite"></div>

    <div id="attachments"></div>

    <form id="chat-form" autocomplete="off">
      <button type="button" id="attach-btn" title="Attach a file">
        <svg viewBox="0 0 24 24"><path d="M16.5 6.5v10a4 4 0 0 1-8 0v-11a2.5 2.5 0 0 1 5 0v10a1 1 0 0 1-2 0v-9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <input type="file" id="file-input" multiple hidden>
      <textarea id="chat-input" rows="1" placeholder="Ask JARVIS anything..."></textarea>
      <button type="button" id="mic-btn" title="Push to talk">
        <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M6 11a6 6 0 0 0 12 0M12 19v2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <button type="submit" id="send-btn">Send</button>
    </form>
  </main>

  <script src="/app.js" defer></script>
</body>
</html>
